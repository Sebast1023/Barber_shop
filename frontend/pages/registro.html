<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Barbería</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">

</head>


<body>

    <main class="auth-page">

        <section class="auth-card">

            <!-- LOGO -->

            <a href="../index.html" class="auth-logo">

                <img
                    src="../img/Logo.jpg"
                    alt="Logo de la barbería"
                >

            </a>


            <!-- ENCABEZADO -->

            <div class="auth-header">

                <p>ÚNETE A NOSOTROS</p>

                <h1>Crear cuenta</h1>

                <span>
                    Regístrate para comenzar a reservar tus citas.
                </span>

            </div>


            <!-- FORMULARIO -->

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Juan Pérez"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="tu@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="300 123 4567"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Crear cuenta
                </button>

            </form>


            <!-- LOGIN -->

            <div class="auth-footer">

                <span>
                    ¿Ya tienes una cuenta?
                </span>

                <a href="login.html">
                    Iniciar sesión
                </a>

            </div>

        </section>

    </main>


    <script src="../js/auth.js"></script>

</body>

</html>
